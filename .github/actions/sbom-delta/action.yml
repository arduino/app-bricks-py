name: Generate SBOM Delta
description: Install Syft, generate the delta SBOM of a published container image and upload it as an artifact.

inputs:
  container:
    description: Container name to scan
    required: true
  version:
    description: Image tag or version
    required: true
  registry:
    description: Registry prefix (e.g. ghcr.io/org/)
    required: true

runs:
  using: composite
  steps:
    - name: Install syft
      shell: bash
      run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Install task
      shell: bash
      run: which task || curl -sSfL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

    - name: Generate delta SBOM
      shell: bash
      env:
        CONTAINER: ${{ inputs.container }}
        VERSION: ${{ inputs.version }}
        REGISTRY: ${{ inputs.registry }}
        OUTPUT_DIR: ${{ runner.temp }}/sbom-delta
      run: |
        task -t Taskfile.dist.yml sbom:delta -- \
          --registry "$REGISTRY" \
          --output-dir "$OUTPUT_DIR" \
          "$CONTAINER:$VERSION"

    - name: Upload delta SBOM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sbom-delta-${{ inputs.container }}-${{ inputs.version }}
        path: ${{ runner.temp }}/sbom-delta/${{ inputs.container }}-${{ inputs.version }}/
        if-no-files-found: error
