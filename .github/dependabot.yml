version: 2
# Dependabot only proposes security fixes, as pull requests where the license scan and the container builds review them.
# Version updates are disabled by the zero pull request limit, the schedule is required but unused.
# Dependabot never rebases on its own: comment "@dependabot rebase" when a pull request falls behind main.
# Docker and compose images have no entry, they are bumped by hand.
updates:
  - package-ecosystem: uv
    directories:
      - /
      - /containers/ai/aihub-litert-models-runner
      - /containers/ai/aihub-onnx-models-runner
      - /containers/ai/ei-qnn-models-runner
      - /containers/ai/llamacpp-npu-runner
      - /containers/ai/llamacpp-runner
      - /containers/base/python-base
      - /containers/bricks/models-downloader
      - /containers/bricks/tps
      - /containers/ai/edge-impulse-runner
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    ignore:
      # python-base ships a custom build of this wheel, bumped by hand
      - dependency-name: opencv-python-headless
    groups:
      # All security fixes of a run fold into one pull request
      python-security:
        applies-to: security-updates
        patterns: ["*"]
