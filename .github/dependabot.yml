version: 2
# Dependency updates arrive as pull requests, where the license scan and the container builds review them
updates:
  - package-ecosystem: uv
    directories:
      - /
      - /containers/aihub-models-runner
      - /containers/ei-qnn-models-runner
      - /containers/gesture-recognition-runner
      - /containers/llamacpp-npu-runner
      - /containers/llamacpp-runner
      - /containers/pose-estimation-runner
      - /containers/python-base
      - /containers/models-downloader
      - /containers/tps-location-api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /containers/*
      - /scripts/licensed
    schedule:
      interval: weekly
    ignore:
      # Digest refreshes only, moving to another Python release is a deliberate change
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
