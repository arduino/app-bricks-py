name: (reusable) Scan published images

# Generates the delta SBOM of already published images, one matrix leg per
# container, and uploads each as a sbom-delta-<name>-<version> artifact. A
# failed scan never fails the job: the image is reported here as a warning and
# the release lists it in MISSING.txt inside sboms.zip.

on:
  workflow_call:
    inputs:
      containers:
        description: "JSON array of container names to scan"
        type: string
        required: true
      version:
        description: "Image tag to scan"
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(inputs.containers) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log into registry ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate delta SBOM
        id: sbom
        continue-on-error: true
        run: |
          python3 -m scripts.sbom_delta \
            --registry "ghcr.io/${{ github.repository_owner }}/" \
            --output-dir "${{ runner.temp }}/sbom-delta" \
            "${{ matrix.container }}:${{ inputs.version }}"

      - name: Upload delta SBOM artifact
        if: steps.sbom.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-delta-${{ matrix.container }}-${{ inputs.version }}
          path: ${{ runner.temp }}/sbom-delta/${{ matrix.container }}-${{ inputs.version }}/
          if-no-files-found: error

      - name: Report failed scan
        if: steps.sbom.outcome == 'failure'
        run: echo "::warning title=SBOM generation failed::${{ matrix.container }}:${{ inputs.version }} could not be scanned and will be missing from sboms.zip"
