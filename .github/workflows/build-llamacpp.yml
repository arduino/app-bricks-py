name: Build llama.cpp with Hexagon support

on:
  workflow_dispatch:
    inputs:
      llama_cpp_repo:
        description: 'llama.cpp repository in owner/repo format (e.g. a fork)'
        required: false
        default: 'ggml-org/llama.cpp'
      llama_cpp_ref:
        description: 'Git ref to build (branch, tag, or commit SHA)'
        required: false
        default: 'master'
      release_version:
        description: 'Release version stamp (e.g. 20260601). Leave empty to only upload as workflow artifact.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    # amd64 host is required: the snapdragon toolchain cross-compiles to arm64
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-linux:v0.6
      options: --user root
    timeout-minutes: 180

    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gh git ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: params
        run: |
          VERSION="${{ inputs.release_version }}"
          REPO="${{ inputs.llama_cpp_repo }}"
          REF="${{ inputs.llama_cpp_ref }}"

          # Fall back to a snapshot stamp when no release version is provided
          STAMP="${VERSION:-snapshot-$(date -u +%Y%m%d)-${GITHUB_SHA::7}}"
          echo "version=$STAMP" >> $GITHUB_OUTPUT
          echo "release_version=$VERSION" >> $GITHUB_OUTPUT
          echo "llama_cpp_repo=$REPO" >> $GITHUB_OUTPUT
          echo "llama_cpp_ref=$REF" >> $GITHUB_OUTPUT
          echo "Building $REPO@$REF as version $STAMP"

      - name: Clone llama.cpp
        run: |
          git clone "https://github.com/${{ steps.params.outputs.llama_cpp_repo }}" llama.cpp
          cd llama.cpp
          git checkout "${{ steps.params.outputs.llama_cpp_ref }}"
          cp ../containers/llamacpp-npu-runner/builder/CMakeUserPresets.json .
          cp ../containers/llamacpp-npu-runner/builder/build-linuxarm64-snapdragon.sh .

      - name: Build llama.cpp (snapdragon/hexagon)
        env:
          LLAMA_CPP_VERSION: ${{ steps.params.outputs.version }}
        run: |
          cd llama.cpp
          chmod +x build-linuxarm64-snapdragon.sh
          ./build-linuxarm64-snapdragon.sh
          mv "llamacpp-${LLAMA_CPP_VERSION}.tar.gz" ..
          cd ..
          sha256sum "llamacpp-${LLAMA_CPP_VERSION}.tar.gz" | tee "llamacpp-${LLAMA_CPP_VERSION}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llamacpp-${{ steps.params.outputs.version }}
          path: |
            llamacpp-${{ steps.params.outputs.version }}.tar.gz
            llamacpp-${{ steps.params.outputs.version }}.tar.gz.sha256

      - name: Create or update release
        if: steps.params.outputs.release_version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.params.outputs.version }}"
          TAG="llamacpp/${VERSION}"
          REPO="${{ github.repository }}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Deleting..."
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          fi

          SHA256=$(cut -d' ' -f1 "llamacpp-${VERSION}.tar.gz.sha256")

          gh release create "$TAG" \
            "llamacpp-${VERSION}.tar.gz" \
            "llamacpp-${VERSION}.tar.gz.sha256" \
            --repo "$REPO" \
            --latest=false \
            --title "llama.cpp $VERSION" \
            --notes "$(printf 'llama.cpp built for ARM64 Linux with the Hexagon NPU (Snapdragon) backend. Built from %s@%s.\n\nSHA256: `%s`' "${{ steps.params.outputs.llama_cpp_repo }}" "${{ steps.params.outputs.llama_cpp_ref }}" "$SHA256")"
