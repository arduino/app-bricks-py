name: Check dependency licenses
on:
  pull_request:

permissions:
  contents: read

jobs:
  check-dependency-licenses:
    runs-on: ubuntu-24.04-arm
    env:
      PYTHON_VERSION: "3.13"
      TASKFILE_VERSION: "v3.44.0"
      TASKFILE_PATH: "/home/runner/go/bin"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install system dependencies
        run: sudo apt-get install -y -qq portaudio19-dev libzbar0

      - name: Install Taskfile
        run: which task || curl -sSfL https://taskfile.dev/install.sh | sh -s -- -b ${{ env.TASKFILE_PATH }} ${{ env.TASKFILE_VERSION }}

      - name: Check dependency licenses
        run: |
          export PATH="${{ env.TASKFILE_PATH }}:$PATH"
          task license:deps

          # Include new untracked dep files in the diff check
          git add -N -- .licenses/

          if git diff --quiet -- .licenses/; then
            echo "✅ Dependency license cache is up to date!" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ⚠️ Dependency license cache is out of date"
              echo ""
              echo "Run \`task license:deps\` locally, then commit and push the updated files."
              echo ""
              echo "| Package | App | Changes |"
              echo "|---------|-----|---------|"
              while IFS=$'\t' read -r status file; do
                app=$(echo "$file" | cut -d'/' -f2)
                pkg=$(basename "$file" .dep.yml)
                case "$status" in
                  A) detail="New dependency" ;;
                  D) detail="Removed" ;;
                  M)
                    diff_out=$(git diff -- "$file")
                    parts=""
                    old_ver=$(echo "$diff_out" | grep '^-version:' | head -1 | sed 's/^-version: *//;s/"//g')
                    new_ver=$(echo "$diff_out" | grep '^+version:' | head -1 | sed 's/^+version: *//;s/"//g')
                    [ -n "$old_ver" ] && [ -n "$new_ver" ] && parts="version ($old_ver → $new_ver)"
                    old_lic=$(echo "$diff_out" | grep '^-license:' | head -1 | sed 's/^-license: *//')
                    new_lic=$(echo "$diff_out" | grep '^+license:' | head -1 | sed 's/^+license: *//')
                    if [ -n "$old_lic" ] && [ -n "$new_lic" ]; then
                      [ -n "$parts" ] && parts="$parts, "
                      parts="${parts}license type ($old_lic → $new_lic)"
                    fi
                    if echo "$diff_out" | grep -qE '^[-+]    '; then
                      [ -n "$parts" ] && parts="$parts, "
                      parts="${parts}license text"
                    fi
                    detail="${parts:-metadata}"
                    ;;
                esac
                echo "| \`$pkg\` | \`$app\` | $detail |"
              done < <(git diff --name-status -- .licenses/)
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
