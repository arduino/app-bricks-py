name: Check dependency licenses
on:
  pull_request:

permissions:
  contents: read

jobs:
  check-dependency-licenses:
    runs-on: ubuntu-24.04-arm
    env:
      PYTHON_VERSION: "3.13"
      TASKFILE_VERSION: "v3.44.0"
      TASKFILE_PATH: "/home/runner/go/bin"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install system dependencies
        run: sudo apt-get install -y -qq portaudio19-dev libzbar0

      - name: Install Taskfile
        run: which task || curl -sSfL https://taskfile.dev/install.sh | sh -s -- -b ${{ env.TASKFILE_PATH }} ${{ env.TASKFILE_VERSION }}

      - name: Check dependency licenses
        run: |
          export PATH="${{ env.TASKFILE_PATH }}:$PATH"
          task license:deps
          if git diff --quiet -- .licenses/; then
            echo "Dependency license cache is up to date!"
          else
            echo "::error::Dependency license cache is out of date. Please run 'task license:deps' locally, then commit and push the updated .licenses/ files."
            echo "Found the following differences:"
            git diff --stat -- .licenses/
            exit 1
          fi
