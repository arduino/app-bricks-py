name: DEV - Build & Publish Branch Containers

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (defaults to selected branch)"
        type: string
        required: false
        default: ""
      containers:
        description: "Comma-separated container names to build, or 'all' for all containers"
        type: string
        default: "all"
      tag:
        description: "Custom image tag (optional, defaults to sanitized branch name)"
        type: string
        default: ""
      skip_cache:
        description: "Rebuild without cache"
        required: false
        type: boolean
        default: false
      sbom:
        description: "Also generate the SBOMs of the published images"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  UV_VERSION: "0.10.3"
  TASKFILE_VERSION: "3.45.4"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      image_tag: ${{ steps.plan.outputs.image_tag }}
      containers: ${{ steps.plan.outputs.containers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Resolve the build
        id: plan
        run: |
          # Compute image tag from branch name unless an explicit tag was provided
          if [[ -n "${{ inputs.tag }}" ]]; then
            IMAGE_TAG="${{ inputs.tag }}"
          else
            IMAGE_TAG="dev-$(echo "${{ inputs.branch || github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          fi
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

          # Widen the selection with the containers deriving from it and with
          # its bases, so the published set stays consistent; bake then orders
          # the builds through the parent links declared in docker-bake.hcl.
          if [[ "${{ inputs.containers }}" == "all" ]]; then
            CONTAINERS=$(python3 -m scripts.container_deps list)
          else
            CONTAINERS=$(python3 -m scripts.container_deps closure $(tr ',' ' ' <<< "${{ inputs.containers }}"))
          fi
          echo "Containers: $(jq -r 'join(" ")' <<< "$CONTAINERS")"
          echo "containers=$CONTAINERS" >> $GITHUB_OUTPUT

          # Containers with a "wheel" bake context install the library from dist/
          TARGETS=$(jq -r 'join(" ")' <<< "$CONTAINERS")
          echo "wheel=$(docker buildx bake --print $TARGETS | jq '[.target[].contexts // {} | has("wheel")] | any')" >> $GITHUB_OUTPUT

      - name: Install uv and task
        if: steps.plan.outputs.wheel == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - if: steps.plan.outputs.wheel == 'true'
        run: uv tool install "go-task-bin==${{ env.TASKFILE_VERSION }}"

      # The compose files bundled in the wheel must reference the images built by this run
      - name: Build the wheel
        if: steps.plan.outputs.wheel == 'true'
        env:
          BRICKS_RELEASE_VERSION: ${{ steps.plan.outputs.image_tag }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          task build

      - name: Log into registry ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      # Bake builds the selected containers and their parents in dependency
      # order through the parent links declared in docker-bake.hcl
      - name: Build and push the images
        uses: docker/bake-action@v7
        with:
          source: .
          files: ./docker-bake.hcl
          targets: ${{ join(fromJson(steps.plan.outputs.containers)) }}
          push: true
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/
          IMAGE_TAG: ${{ steps.plan.outputs.image_tag }}
          RUN_NUMBER: ${{ github.run_number }}
          BASE_IMAGE_VERSION: ${{ steps.plan.outputs.image_tag }}
          CACHE_TAG: ${{ steps.plan.outputs.image_tag }}-buildcache
          SKIP_CACHE: ${{ inputs.skip_cache }}
          GITHUB_SHA: ${{ github.sha }}

  sbom:
    needs: [build]
    if: inputs.sbom
    uses: ./.github/workflows/_sbom-scan.yml
    with:
      containers: ${{ needs.build.outputs.containers }}
      version: ${{ needs.build.outputs.image_tag }}
