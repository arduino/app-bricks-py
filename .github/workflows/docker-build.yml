name: DEV - Build & Publish Branch Containers

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (defaults to selected branch)"
        type: string
        required: false
        default: ""
      containers:
        description: "Comma-separated container names to build, or 'all' for all containers"
        type: string
        default: "all"
      tag:
        description: "Custom image tag (optional, defaults to sanitized branch name)"
        type: string
        default: ""
      skip_cache:
        description: "Rebuild without cache"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-24.04-arm
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      image_tag: ${{ steps.detect.outputs.image_tag }}
      level_0: ${{ steps.detect.outputs.level_0 }}
      level_1: ${{ steps.detect.outputs.level_1 }}
      level_2: ${{ steps.detect.outputs.level_2 }}
    steps:
      - name: Resolve branch
        id: resolve
        run: |
          BRANCH="${{ inputs.branch || github.ref_name }}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.branch }}
          fetch-depth: 0

      - name: Resolve containers to build
        id: detect
        run: |
          # Compute image tag from branch name unless an explicit tag was provided
          if [[ -n "${{ inputs.tag }}" ]]; then
            IMAGE_TAG="${{ inputs.tag }}"
          else
            IMAGE_TAG="dev-$(echo "${{ steps.resolve.outputs.branch }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          fi
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

          # Compute the topological build plan (level_0 .. level_4) and append it
          # to $GITHUB_OUTPUT. Bases are always placed before the images that
          # derive FROM them, and both descendants and ancestors of the selection
          # are pulled in so the full chain is rebuilt in order.
          python3 -m scripts.build_levels --mode dev --select "${{ inputs.containers }}"

  build-l0:
    needs: [setup]
    if: needs.setup.outputs.level_0 != '[]'
    uses: ./.github/workflows/_build-containers-dev.yml
    with:
      containers: ${{ needs.setup.outputs.level_0 }}
      branch: ${{ needs.setup.outputs.branch }}
      image_tag: ${{ needs.setup.outputs.image_tag }}
      skip_cache: ${{ inputs.skip_cache }}

  build-l1:
    needs: [setup, build-l0]
    if: needs.setup.outputs.level_1 != '[]'
    uses: ./.github/workflows/_build-containers-dev.yml
    with:
      containers: ${{ needs.setup.outputs.level_1 }}
      branch: ${{ needs.setup.outputs.branch }}
      image_tag: ${{ needs.setup.outputs.image_tag }}
      skip_cache: ${{ inputs.skip_cache }}

  build-l2:
    needs: [setup, build-l1]
    if: needs.setup.outputs.level_2 != '[]'
    uses: ./.github/workflows/_build-containers-dev.yml
    with:
      containers: ${{ needs.setup.outputs.level_2 }}
      branch: ${{ needs.setup.outputs.branch }}
      image_tag: ${{ needs.setup.outputs.image_tag }}
      skip_cache: ${{ inputs.skip_cache }}
