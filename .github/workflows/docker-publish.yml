name: RELEASE - Build & Publish Release

run-name: "Release ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags:
      - "release/*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. release/1.2.3)"
        type: string
        required: true
      skip_cache:
        description: "Rebuild without cache"
        type: boolean
        required: false
        default: false

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_DESTINATION_ORG: ghcr.io/${{ github.repository_owner }}
  GH_DESTINATION_REPO: https://github.com/${{ github.repository }}

permissions:
  contents: write
  packages: write
  id-token: write
  actions: write

jobs:
  detect:
    runs-on: ubuntu-24.04-arm
    outputs:
      tag_ref: ${{ steps.detect.outputs.tag_ref }}
      version: ${{ steps.detect.outputs.version }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
      level_0: ${{ steps.detect.outputs.level_0 }}
      level_1: ${{ steps.detect.outputs.level_1 }}
      level_2: ${{ steps.detect.outputs.level_2 }}
      all_containers: ${{ steps.detect.outputs.all_containers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect containers to release
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_REF="${{ inputs.tag }}"
          else
            TAG_REF="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG_REF#*/}"
          echo "tag_ref=$TAG_REF" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION" =~ rc|alpha|beta ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

          # Every container is released at this version. The plan is split into
          # topological waves (level_0 .. level_2) so bases build first.
          python3 -m scripts.build_levels --mode release

  upload-whl:
    runs-on: ubuntu-24.04-arm
    needs: [detect]
    env:
      PYTHON_VERSION: "3.13"
      TASKFILE_VERSION: "3.45.4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject release version
        run: sed -i 's/^__version__ = .*/__version__ = "${{ needs.detect.outputs.version }}"/' src/arduino/version.py

      - name: Build wheel in debian:trixie
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            debian:trixie bash -c "
              set -e
              apt-get update
              apt-get install -y --no-install-recommends --no-install-suggests sudo git ca-certificates python3-dev python3-pip build-essential pkg-config
              echo '[global]' > /etc/pip.conf
              echo 'break-system-packages = true' >> /etc/pip.conf
              git config --global --add safe.directory '*'
              pip install go-task-bin==${{ env.TASKFILE_VERSION }} uv==0.10.3
              task init:ci
              task build
              cp pyproject.toml uv.lock dist/
            "

      - name: Share wheel and lock with downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: whl
          path: |
            dist/arduino*.whl
            dist/pyproject.toml
            dist/uv.lock
          retention-days: 1

  build-l0:
    needs: [detect, upload-whl]
    if: needs.detect.outputs.level_0 != '[]'
    uses: ./.github/workflows/_build-containers-release.yml
    secrets: inherit
    with:
      containers: ${{ needs.detect.outputs.level_0 }}
      version: ${{ needs.detect.outputs.version }}
      tag_ref: ${{ needs.detect.outputs.tag_ref }}
      prerelease: ${{ needs.detect.outputs.prerelease }}
      allow_retag: true
      skip_cache: ${{ inputs.skip_cache || false }}

  build-l1:
    needs: [detect, upload-whl, build-l0]
    if: needs.detect.outputs.level_1 != '[]'
    uses: ./.github/workflows/_build-containers-release.yml
    secrets: inherit
    with:
      containers: ${{ needs.detect.outputs.level_1 }}
      version: ${{ needs.detect.outputs.version }}
      tag_ref: ${{ needs.detect.outputs.tag_ref }}
      prerelease: ${{ needs.detect.outputs.prerelease }}
      allow_retag: false
      skip_cache: ${{ inputs.skip_cache || false }}

  build-l2:
    needs: [detect, upload-whl, build-l1]
    if: needs.detect.outputs.level_2 != '[]'
    uses: ./.github/workflows/_build-containers-release.yml
    secrets: inherit
    with:
      containers: ${{ needs.detect.outputs.level_2 }}
      version: ${{ needs.detect.outputs.version }}
      tag_ref: ${{ needs.detect.outputs.tag_ref }}
      prerelease: ${{ needs.detect.outputs.prerelease }}
      allow_retag: false
      skip_cache: ${{ inputs.skip_cache || false }}

  # SBOM scans run one wave behind the builds: each wave is scanned as soon as it
  # is pushed, in parallel with the next wave's build. Scans never fail the
  # workflow run: a missing SBOM is then reported by upload-release.
  sbom-l0:
    needs: [detect, build-l0]
    if: needs.detect.outputs.level_0 != '[]'
    uses: ./.github/workflows/_sbom-wave.yml
    with:
      images: ${{ needs.detect.outputs.level_0 }}
      version: ${{ needs.detect.outputs.version }}

  sbom-l1:
    needs: [detect, build-l1]
    if: needs.detect.outputs.level_1 != '[]'
    uses: ./.github/workflows/_sbom-wave.yml
    with:
      images: ${{ needs.detect.outputs.level_1 }}
      version: ${{ needs.detect.outputs.version }}

  sbom-l2:
    needs: [detect, build-l2]
    if: needs.detect.outputs.level_2 != '[]'
    uses: ./.github/workflows/_sbom-wave.yml
    with:
      images: ${{ needs.detect.outputs.level_2 }}
      version: ${{ needs.detect.outputs.version }}

  upload-release:
    runs-on: ubuntu-24.04-arm
    # Skipped waves (and their scans) must not skip this job, failed builds must.
    if: ${{ !failure() && !cancelled() }}
    needs: [detect, upload-whl, build-l0, build-l1, build-l2, sbom-l0, sbom-l1, sbom-l2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist/

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-delta-*
          path: sbom-delta/

      - name: Assemble sboms.zip
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          CONTAINERS: ${{ needs.detect.outputs.all_containers }}
        run: |
          shopt -s nullglob
          mkdir -p sbom-delta

          # Artifacts are named sbom-delta-<name>-<version>: strip the prefix so the
          # archive holds one <name>-<version>/ folder per image.
          for dir in sbom-delta/sbom-delta-*/; do
            mv "$dir" "sbom-delta/$(basename "$dir" | sed 's/^sbom-delta-//')"
          done

          # Every released image must be covered. A missing SBOM is a warning,
          # not a blocker: it is listed in the archive and in the job summary.
          MISSING=()
          while IFS= read -r NAME; do
            [[ -f "sbom-delta/${NAME}-${VERSION}/delta.spdx.json" ]] || MISSING+=("$NAME:$VERSION")
          done < <(jq -r '.[]' <<< "$CONTAINERS")

          if (( ${#MISSING[@]} )); then
            printf '%s\n' "${MISSING[@]}" > sbom-delta/MISSING.txt
            for IMAGE in "${MISSING[@]}"; do
              echo "::warning title=SBOM missing::$IMAGE has no SBOM in sboms.zip, see the sbom-* jobs"
            done
            { echo "## SBOMs missing from sboms.zip"; printf -- '- %s\n' "${MISSING[@]}"; } >> "$GITHUB_STEP_SUMMARY"
          fi

          zip -r dist/sboms.zip sbom-delta/

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/arduino*.whl
            dist/sboms.zip
          tag_name: ${{ needs.detect.outputs.tag_ref }}
          name: Release ${{ needs.detect.outputs.version }}
          prerelease: ${{ needs.detect.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
