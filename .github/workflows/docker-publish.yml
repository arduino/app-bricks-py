name: RELEASE - Build & Publish Release

run-name: "Release ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags:
      - "release/*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. release/1.2.3)"
        type: string
        required: true
      skip_cache:
        description: "Rebuild without cache"
        type: boolean
        required: false
        default: false

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_DESTINATION_ORG: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: write
  packages: write
  id-token: write
  actions: write

jobs:
  detect:
    runs-on: ubuntu-24.04-arm
    outputs:
      tag_ref: ${{ steps.detect.outputs.tag_ref }}
      version: ${{ steps.detect.outputs.version }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
      containers: ${{ steps.detect.outputs.containers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect containers to release
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_REF="${{ inputs.tag }}"
          else
            TAG_REF="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG_REF#*/}"
          echo "tag_ref=$TAG_REF" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION" =~ rc|alpha|beta ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

          # Every container is released at this version. The Dockerfiles and
          # docker-bake.hcl must describe the same set of containers.
          CONTAINERS=$(python3 -m scripts.container_deps list | jq -c .)
          BAKE_TARGETS=$(docker buildx bake --print 2>/dev/null | jq -c '.target | keys')
          if [[ "$CONTAINERS" != "$BAKE_TARGETS" ]]; then
            echo "::error::docker-bake.hcl targets $BAKE_TARGETS differ from the containers $CONTAINERS"
            exit 1
          fi
          echo "Containers: $(jq -r 'join(" ")' <<< "$CONTAINERS")"
          echo "containers=$CONTAINERS" >> $GITHUB_OUTPUT

  upload-whl:
    runs-on: ubuntu-24.04-arm
    needs: [detect]
    env:
      PYTHON_VERSION: "3.13"
      TASKFILE_VERSION: "3.45.4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject release version
        run: sed -i 's/^__version__ = .*/__version__ = "${{ needs.detect.outputs.version }}"/' src/arduino/version.py

      - name: Build wheel in debian:trixie
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            debian:trixie bash -c "
              set -e
              apt-get update
              apt-get install -y --no-install-recommends --no-install-suggests sudo git ca-certificates python3-dev python3-pip build-essential pkg-config
              echo '[global]' > /etc/pip.conf
              echo 'break-system-packages = true' >> /etc/pip.conf
              git config --global --add safe.directory '*'
              pip install go-task-bin==${{ env.TASKFILE_VERSION }} uv==0.10.3
              task init:ci
              task build
            "

      - name: Share wheel and lock with downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: whl
          path: |
            dist/arduino*.whl
            dist/pyproject.toml
            dist/uv.lock
          retention-days: 1

  build:
    runs-on: ubuntu-24.04-arm
    needs: [detect, upload-whl]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The wheel bake context of python-apps-base
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist/

      - name: Log into registry ${{ env.GHCR_REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      # Bake builds every container in dependency order through the parent
      # links declared in docker-bake.hcl. The registry cache is content
      # addressed: only the layers whose inputs changed since the previous
      # release are rebuilt, skip_cache forces a cold rebuild.
      - name: Build and push Docker images
        uses: docker/bake-action@v7
        with:
          source: .
          files: ./docker-bake.hcl
          targets: ${{ join(fromJson(needs.detect.outputs.containers)) }}
          push: true
        env:
          REGISTRY: ${{ env.GHCR_DESTINATION_ORG }}/
          IMAGE_TAG: ${{ needs.detect.outputs.version }}
          TAG_LATEST: ${{ needs.detect.outputs.prerelease == 'false' }}
          BASE_IMAGE_VERSION: ${{ needs.detect.outputs.version }}
          CACHE_TAG: buildcache
          SKIP_CACHE: ${{ inputs.skip_cache || false }}
          GITHUB_SHA: ${{ github.sha }}

  # Scans never fail the workflow run: a missing SBOM is reported by upload-release.
  sbom:
    needs: [detect, build]
    uses: ./.github/workflows/_sbom-wave.yml
    with:
      images: ${{ needs.detect.outputs.containers }}
      version: ${{ needs.detect.outputs.version }}

  upload-release:
    runs-on: ubuntu-24.04-arm
    # Failed scans must not skip this job, failed builds must.
    if: ${{ !failure() && !cancelled() }}
    needs: [detect, upload-whl, build, sbom]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist/

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-delta-*
          path: sbom-delta/

      - name: Assemble sboms.zip
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          CONTAINERS: ${{ needs.detect.outputs.containers }}
        run: |
          shopt -s nullglob
          mkdir -p sbom-delta

          # Artifacts are named sbom-delta-<name>-<version>: strip the prefix so the
          # archive holds one <name>-<version>/ folder per image.
          for dir in sbom-delta/sbom-delta-*/; do
            mv "$dir" "sbom-delta/$(basename "$dir" | sed 's/^sbom-delta-//')"
          done

          # Every released image must be covered. A missing SBOM is a warning,
          # not a blocker: it is listed in the archive and in the job summary.
          MISSING=()
          while IFS= read -r NAME; do
            [[ -f "sbom-delta/${NAME}-${VERSION}/delta.spdx.json" ]] || MISSING+=("$NAME:$VERSION")
          done < <(jq -r '.[]' <<< "$CONTAINERS")

          if (( ${#MISSING[@]} )); then
            printf '%s\n' "${MISSING[@]}" > sbom-delta/MISSING.txt
            for IMAGE in "${MISSING[@]}"; do
              echo "::warning title=SBOM missing::$IMAGE has no SBOM in sboms.zip, see the sbom job"
            done
            { echo "## SBOMs missing from sboms.zip"; printf -- '- %s\n' "${MISSING[@]}"; } >> "$GITHUB_STEP_SUMMARY"
          fi

          zip -r dist/sboms.zip sbom-delta/

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/arduino*.whl
            dist/sboms.zip
          tag_name: ${{ needs.detect.outputs.tag_ref }}
          name: Release ${{ needs.detect.outputs.version }}
          prerelease: ${{ needs.detect.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
