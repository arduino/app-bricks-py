name: RELEASE - Build & Publish Release

run-name: "Release ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags:
      - "release/*"
      - "ai/*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. release/1.2.3)"
        type: string
        required: true

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_DESTINATION_ORG: ghcr.io/${{ github.repository_owner }}
  GH_DESTINATION_REPO: https://github.com/${{ github.repository }}

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write
  actions: write

jobs:
  detect:
    runs-on: ubuntu-24.04-arm
    outputs:
      tag_ref: ${{ steps.detect.outputs.tag_ref }}
      version: ${{ steps.detect.outputs.version }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
      level_0: ${{ steps.detect.outputs.level_0 }}
      level_1: ${{ steps.detect.outputs.level_1 }}
      level_2: ${{ steps.detect.outputs.level_2 }}
      level_3: ${{ steps.detect.outputs.level_3 }}
      level_4: ${{ steps.detect.outputs.level_4 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect containers to release
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_REF="${{ inputs.tag }}"
          else
            TAG_REF="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG_REF#*/}"
          echo "tag_ref=$TAG_REF" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION" =~ rc|alpha|beta ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

          # Seed the build plan with the containers whose tag_prefix matches the
          # pushed tag prefix, then pull in all their descendants and split the
          # result into topological waves (level_0 .. level_4).
          TAG_PREFIX_FILTER="${TAG_REF%%/*}"
          echo "Tag prefix filter: ${TAG_PREFIX_FILTER}"
          python3 -m scripts.build_levels --mode release --tag-prefix "$TAG_PREFIX_FILTER"

  upload-whl:
    runs-on: ubuntu-24.04-arm
    needs: [detect]
    env:
      PYTHON_VERSION: "3.13"
      TASKFILE_VERSION: "3.45.4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build wheel in debian:trixie
        if: startsWith(needs.detect.outputs.tag_ref, 'release/')
        run: |
          # Remove tags that setuptools_scm can't parse (only ai/* and release/* are valid)
          git tag -l | grep -v -E '^(ai|release)/' | xargs -r git tag -d

          # Explicitly set the version so setuptools_scm does not need the git tag to exist
          # (handles workflow_dispatch runs where no tag has been pushed yet)
          docker run --rm \
            -v "${{ github.workspace }}:/${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -e PUBLIC_IMAGE_REGISTRY_BASE="${{ env.GHCR_DESTINATION_ORG }}/" \
            -e SETUPTOOLS_SCM_PRETEND_VERSION="${{ needs.detect.outputs.version }}" \
            debian:trixie bash -c "
              set -e
              apt-get update
              apt-get install -y --no-install-recommends --no-install-suggests sudo git ca-certificates python3-dev python3-pip build-essential pkg-config
              echo '[global]' > /etc/pip.conf
              echo 'break-system-packages = true' >> /etc/pip.conf
              git config --global --add safe.directory '*'
              pip install go-task-bin==${{ env.TASKFILE_VERSION }}
              pip install https://github.com/${{ github.repository }}/releases/download/opencv/4.13.0.92/opencv_python_headless-4.13.0.92-cp313-cp313-linux_aarch64.whl
              task init:ci
              task build
            "

      - name: Share wheel with downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: whl
          path: dist/arduino*.whl
          retention-days: 1

  build-l0:
    needs: [detect, upload-whl]
    if: needs.detect.outputs.level_0 != '[]'
    uses: ./.github/workflows/_build-containers-release.yml
    secrets: inherit
    with:
      containers: ${{ needs.detect.outputs.level_0 }}
      version: ${{ needs.detect.outputs.version }}
      tag_ref: ${{ needs.detect.outputs.tag_ref }}
      prerelease: ${{ needs.detect.outputs.prerelease }}
      allow_retag: true

  build-l1:
    needs: [detect, upload-whl, build-l0]
    if: needs.detect.outputs.level_1 != '[]'
    uses: ./.github/workflows/_build-containers-release.yml
    secrets: inherit
    with:
      containers: ${{ needs.detect.outputs.level_1 }}
      version: ${{ needs.detect.outputs.version }}
      tag_ref: ${{ needs.detect.outputs.tag_ref }}
      prerelease: ${{ needs.detect.outputs.prerelease }}
      allow_retag: false

  build-l2:
    needs: [detect, upload-whl, build-l1]
    if: needs.detect.outputs.level_2 != '[]'
    uses: ./.github/workflows/_build-containers-release.yml
    secrets: inherit
    with:
      containers: ${{ needs.detect.outputs.level_2 }}
      version: ${{ needs.detect.outputs.version }}
      tag_ref: ${{ needs.detect.outputs.tag_ref }}
      prerelease: ${{ needs.detect.outputs.prerelease }}
      allow_retag: false

  build-l3:
    needs: [detect, upload-whl, build-l2]
    if: needs.detect.outputs.level_3 != '[]'
    uses: ./.github/workflows/_build-containers-release.yml
    secrets: inherit
    with:
      containers: ${{ needs.detect.outputs.level_3 }}
      version: ${{ needs.detect.outputs.version }}
      tag_ref: ${{ needs.detect.outputs.tag_ref }}
      prerelease: ${{ needs.detect.outputs.prerelease }}
      allow_retag: false

  build-l4:
    needs: [detect, upload-whl, build-l3]
    if: needs.detect.outputs.level_4 != '[]'
    uses: ./.github/workflows/_build-containers-release.yml
    secrets: inherit
    with:
      containers: ${{ needs.detect.outputs.level_4 }}
      version: ${{ needs.detect.outputs.version }}
      tag_ref: ${{ needs.detect.outputs.tag_ref }}
      prerelease: ${{ needs.detect.outputs.prerelease }}
      allow_retag: false

  upload-release:
    runs-on: ubuntu-24.04-arm
    if: startsWith(needs.detect.outputs.tag_ref, 'release/')
    needs: [detect, upload-whl, build-l0, build-l1, build-l2, build-l3, build-l4]
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: whl
          path: dist/

      - name: Download all SBOM delta artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-delta-*
          path: sbom-delta/

      - name: Zip SBOM artifacts
        run: zip -r dist/sboms.zip sbom-delta/

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/arduino*.whl
            dist/sboms.zip
          tag_name: ${{ needs.detect.outputs.tag_ref }}
          name: Release ${{ needs.detect.outputs.version }}
          prerelease: ${{ needs.detect.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
