cache_path: .licenses

apps:
  - name: python-apps-base
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "/venvs/python-apps-base"

  - name: python-base
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "/venvs/python-base"

  - name: aihub-models-runner
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "/venvs/aihub-models-runner"

  - name: gesture-recognition-runner
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "/venvs/gesture-recognition-runner"

  - name: pose-estimation-runner
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "/venvs/pose-estimation-runner"

  - name: models-downloader
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "/venvs/models-downloader"
  - name: ei-qnn-models-runner
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "/venvs/ei-qnn-models-runner"

  - name: llamacpp-runner
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "/venvs/llamacpp-runner"

  - name: llamacpp-npu-runner
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "/venvs/llamacpp-npu-runner"

stale_records_action: error

ignored:
  pip:
    - pip
    - setuptools
    - wheel
    - uv
    - arduino-app-bricks
    - arduino_app_bricks

# Packages whose wheel metadata licensee cannot classify (missing or
# unrecognized license text in the distribution); licenses verified manually.
reviewed:
  pip:
    - defusedxml        # PSF-2.0
    - langchain-core    # MIT
    - langsmith         # MIT
    - ai-edge-litert    # Apache-2.0
    - tzdata            # Apache-2.0
    - pyalsaaudio       # PSF-2.0
    - certifi           # MPL-2.0, modified ca-bundle notice not recognised by licensee 9.20

allowed:
  - mpl-2.0
  - apache-2.0
  - mit
  - mit-cmu
  - bsd-2-clause
  - bsd-3-clause
  - cc0-1.0
  - isc
  - psf-2.0
  - unlicense
  - ofl-1.1
  - lgpl-3.0-only
  - epl-2.0
  - zpl-2.1
