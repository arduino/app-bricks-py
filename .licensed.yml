cache_path: .licenses

# venv.project is the uv project scripts/licensed/run.py installs into each app's virtual_env_dir
apps:
  - name: python-apps-base
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "/venvs/python-apps-base"
    venv:
      project: .
      extras: [all]

  - name: python-base
    source_path: .
    sources:
      pip: true
    python:
      virtual_env_dir: "/venvs/python-base"
    venv:
      project: containers/base/python-base

