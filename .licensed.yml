stale_records_action: error

ignored:
  pip:
    - pip
    - setuptools
    - wheel
    - uv
    - arduino-app-bricks
    - arduino_app_bricks

# Packages whose wheel metadata licensee cannot classify (missing or
# unrecognized license text in the distribution); licenses verified manually.
reviewed:
  pip:
    - defusedxml        # PSF-2.0
    - langchain-core    # MIT
    - langsmith         # MIT
    - ai-edge-litert    # Apache-2.0
    - tzdata            # Apache-2.0
    - pyalsaaudio       # PSF-2.0
    - certifi           # MPL-2.0, modified ca-bundle notice not recognised by licensee 9.20
    - backports.strenum # PSF-2.0, ships CPython's LICENSE file while its metadata says MIT
    - typing_extensions # PSF-2.0, ships CPython's LICENSE file with its history preamble, not matched by newer licensee
    - numpy             # BSD-3-Clause, its LICENSE.txt also carries the notices of the bundled libraries, not matched by newer licensee

allowed:
  - mpl-2.0
  - apache-2.0
  - mit
  - mit-cmu
  - bsd-2-clause
  - bsd-3-clause
  - bsd-3-clause-clear # BSD-3-Clause with an explicit no patent grant clause (edge-impulse-linux)
  - cc0-1.0
  - isc
  - psf-2.0
  - unlicense
  - ofl-1.1
  - lgpl-3.0-only
  - epl-2.0
  - zpl-2.1
