version = 1

# When several tables match a file, the last one wins

# Configuration, documentation and data files, which take no license header
[[annotations]]
path = [
  "**/*.md",
  "**/*.yaml",
  "**/*.yml",
  "**/*.toml",
  "**/*.json",
  "**/*.lock",
  "**/*.patch",
  "**/*.txt",
  "**/*.in",
  "**/*.ini",
  "**/.gitignore",
  "**/.dockerignore",
  ".python-version",
  "containers/ai/aihub-onnx-models-runner/tests/ocr_runner_images/**",
  "integration_tests/genie-genai-test-suite/VLM-IMAGES/**",
  "src/arduino/app_bricks/pose_estimation/assets/pose_classifier.npz",
  "src/arduino/app_bricks/streamlit_ui/assets/RGB-Arduino-Logo-Color-Inline-Loop.svg",
]
SPDX-FileCopyrightText = "Copyright (C) Arduino s.r.l. and/or its affiliated companies"
SPDX-License-Identifier = "MPL-2.0"

# Third-party files that carry their notice inside: the MIT license in the zip, the OFL in the font metadata
[[annotations]]
path = "src/arduino/app_bricks/mood_detector/assets/nltk_data/sentiment/vader_lexicon.zip"
SPDX-FileCopyrightText = "2016 C.J. Hutto"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "src/arduino/app_utils/image/assets/OpenSans-SemiBold.ttf"
SPDX-FileCopyrightText = "2020 The Open Sans Project Authors (https://github.com/googlefonts/opensans)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ".licenses/**"
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "LicenseRef-licensed-cache"
