version: "3"

tasks:
  init:
    desc: Set up the development environment, uv provides Python 3.13 and installs the library and every container into their .venv
    cmds:
      - task: deps:sync

  init:ci:
    desc: Initialize CI environment
    cmds:
      - apt-get update
      - apt-get install -y --no-install-recommends --no-install-suggests libasound2-dev portaudio19-dev libzbar0
      - apt-get install -y --no-install-recommends --no-install-suggests gh git ca-certificates build-essential pkg-config
      - apt-get install -y --no-install-recommends --no-install-suggests libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
      - apt-get install -y --no-install-recommends --no-install-suggests libjpeg62-turbo-dev libpng-dev libtiff-dev libwebp-dev libopenblas-dev liblapacke-dev
      - apt-get install -y --no-install-recommends --no-install-suggests libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uv sync --frozen --extra dev

  deps:lock:
    desc: Refresh uv.lock for the library and every container, pass -- --upgrade to move to newer versions
    cmds:
      - uv lock {{.CLI_ARGS}}
      - for p in containers/*/pyproject.toml; do uv lock --project "$(dirname "$p")" {{.CLI_ARGS}} || exit 1; done

  deps:sync:
    desc: Install the locked dependencies of the library and every container into their .venv for local development
    cmds:
      - uv sync --frozen --extra dev {{.CLI_ARGS}}
      - for p in containers/*/pyproject.toml; do uv sync --frozen --project "$(dirname "$p")" {{.CLI_ARGS}} || exit 1; done

  deps:check:
    desc: Fail if any uv.lock is out of date with its pyproject.toml, run task deps:lock to refresh
    cmds:
      - uv lock --check
      - for p in containers/*/pyproject.toml; do uv lock --check --project "$(dirname "$p")" || exit 1; done

  doc:
    desc: Generate the API documentation under docs/
    cmds:
      - uv run --group build python -m docs_generator.runner docs

  test:
    desc: Run all unit tests, of the library and of the containers
    cmds:
      - uv run pytest -vs ./tests --ignore=tests/arduino/app_bricks/cloud_llm/eval/
      - task: test:containers

  test:containers:
    desc: Run the tests of every container with a Python test suite, each in its own .venv with its test dependency group
    cmds:
      - for d in containers/*; do ls "$d"/tests/*.py >/dev/null 2>&1 || continue; uv run --frozen --group test --project "$d" python -m pytest -vs "$d/tests" || exit 1; done

  llm_test:
    desc: Run all LLM tests
    cmds:
      - uv run deepeval test run tests/arduino/app_bricks/cloud_llm/eval/ -n 4 -vs

  test:*:
    desc: Run tests for a specific folder
    cmds:
      - uv run pytest -vs ./tests/{{index .MATCH 0}}

  lint:
    desc: Run linters
    cmds:
      - uv run ruff check --fix .

  check:api:
    desc: "Check the API contract with app-bricks-examples: pyright over the examples (profile api-user) and the bricks coverage. Extra args go to the run mode, see scripts/check_pyright.py --help"
    cmds:
      - uv run python scripts/check_pyright.py run {{.CLI_ARGS}}
      - uv run python scripts/check_pyright.py coverage

  check:typing:
    desc: "Type-check the library sources with pyright (profile app-bricks-py). Extra args go to the typing mode, see scripts/check_pyright.py --help"
    cmds:
      - uv run python scripts/check_pyright.py typing {{.CLI_ARGS}}

  fmt:
    desc: Format code
    cmds:
      - uv run ruff format

  provision-static:
    desc: Provision the static assets bundled into the wheel, BRICKS_RELEASE_VERSION overrides the version stamped into compose and models files
    cmds:
      - rm -rf src/arduino/app_bricks/static
      - task: doc
      - uv run --group build arduino-bricks-release --static-dir src/arduino/app_bricks/static --api-docs-dir docs

  build:
    desc: Build the wheel, its version is read from src/arduino/version.py
    cmds:
      - defer: rm -rf src/arduino/app_bricks/static
      - rm -rf dist
      - task: provision-static
      - uv run uv build .
      - cp pyproject.toml uv.lock dist/

  license:headers:
    desc: Update SPDX license headers (REUSE)
    cmds:
      - |
        git ls-files |
        grep -Ev "(^|/)(docs|examples-internal|tools)/|\.(md|txt|json|yml|yaml|toml|gitignore|dockerignore|gitmodules|in|ini|eim|lock)$" |
        sed 's/ /\\ /g' |
        xargs uv run reuse annotate -r --skip-unrecognized --copyright-prefix 'spdx-string-c' --copyright 'Arduino s.r.l. and/or its affiliated companies' --exclude-year --license 'MPL-2.0'
      - uv run reuse download --all
      - |
        licenses_dir="LICENSES"
        if [ -d "$licenses_dir" ]; then
          if [ -f "$licenses_dir/MPL-2.0.txt" ]; then
            mv "$licenses_dir/MPL-2.0.txt" LICENSE.txt
          fi
          rm -rf "$licenses_dir"
        fi
      # Strip trailing whitespace from license files.
      # The upstream SPDX license texts (fetched by `reuse download`)
      # contain stray trailing spaces that break license parsers such
      # as `licensed`.
      - cmd: find . -maxdepth 1 -name 'LICENSE*' -type f -exec sed -i '' 's/[[:space:]]*$//' {} +
        platforms: [darwin]
      - cmd: find . -maxdepth 1 -name 'LICENSE*' -type f -exec sed -i 's/[[:space:]]*$//' {} +
        platforms: [linux, windows]

  license:deps:
    desc: Check and cache dependency licenses (licensed, via Docker)
    cmds:
      - task: license:deps:build
      - task: license:deps:run

  license:deps:build:
    desc: Build the licensed image
    cmds:
      - docker build -t arduino-licensed scripts/licensed

  license:deps:run:
    desc: Run the licensed scan, LICENSED_VENVS is the volume or host directory holding the venvs
    vars:
      LICENSED_VENVS: '{{.LICENSED_VENVS | default "arduino-licensed-venvs"}}'
    cmds:
      - docker run --rm -v "$(pwd):/src" -v "{{.LICENSED_VENVS}}:/venvs" arduino-licensed

  license:deps:clean:
    desc: Remove the venvs cached by the licensed scan, the image itself is kept
    cmds:
      - docker volume rm -f arduino-licensed-venvs

  license:
    desc: Update license headers, files, and dependency license caches
    cmds:
      - task: license:headers
      - task: license:deps

  sbom:delta:
    desc: Generate delta SBOMs for containers (requires syft and registry access)
    cmds:
      - python3 -m scripts.sbom_delta {{.CLI_ARGS}}

  containers:tree:
    desc: Print the container hierarchy derived from the Dockerfiles
    cmds:
      - python3 -m scripts.container_deps tree

  containers:check:
    desc: Check that docker-bake.hcl agrees with the Dockerfiles
    cmds:
      - docker buildx bake --print 2>/dev/null | python3 -m scripts.container_deps check-bake
