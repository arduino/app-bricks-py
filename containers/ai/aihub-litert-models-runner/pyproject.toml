# Python packages this image installs, pinned with hashes in uv.lock, see containers/README.md
#
# Shared by every runner built on this image (gesture-recognition-runner,
# pose-estimation-runner), which is why they are installed here and not per runner:
#
#   websockets, flask, waitress  the `aihub` framework's own runtime dependencies
#   opencv-python-headless       the `aihub` framework itself needs cv2 (the websocket input
#                                decodes frames with it), so every runner does. ~90 MB of
#                                wheel, installed once instead of once per runner.
#   ai-edge-litert               the LiteRT interpreter and the QNN delegate loader behind
#                                aihub.tf.load_qnn_delegate(); it is what makes this base the
#                                LiteRT one, as opposed to aihub-onnx-models-runner.
[project]
name = "aihub-litert-models-runner"
version = "0"
requires-python = "==3.13.*"
dependencies = [
    "websockets",
    "flask",
    "waitress",
    "opencv-python-headless",
    "ai-edge-litert",
]

[tool.uv]
# The images run on aarch64 Linux, the lock must resolve for that target but installs on developer machines too
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
