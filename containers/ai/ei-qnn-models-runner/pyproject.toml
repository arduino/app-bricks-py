# Python packages this image installs, pinned with hashes in uv.lock, see containers/README.md
[project]
name = "ei-qnn-models-runner"
version = "0"
requires-python = "==3.13.*"
dependencies = [
    "requests",
]

[tool.uv]
# The images run on aarch64 Linux only, the lock is resolved for that target alone
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
