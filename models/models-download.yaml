runners:
  - ei-models-runner:
      platforms:
        - ventunoq:
            docker:
              image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/ei-qnn-models-runner:dev-next
              volumes:
                - ${download_location}:/models
              entrypoint: ["sh", "-c", "python download_ei_build.py --ei-project-id ${ei-project-id} --impulse-id ${ei-impulse-id} --output-name ${model_name} --output-dir /models --output-name ${model_name}"]
        - unoq:
            docker:
              image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/ei-models-runner:dev-next
              volumes:
                - ${download_location}:/models
              entrypoint: ["sh", "-c", "python download_ei_build.py --ei-project-id ${ei-project-id} --impulse-id ${ei-impulse-id} --output-name ${model_name} --output-dir /models --output-name ${model_name}"]
  - genie-models-runner:
      platforms:
        - ventunoq:
            docker:
              image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/genie-models-runner:dev-next
              volumes:
                - ${download_location}:/models
              entrypoint: ["sh", "-c", "cd /models && qai_hub_models fetch ${model_name} -r ${model_type} -p ${quantization} -c ${chipset} -v ${version}"]
  - audio-analytics-models-runner:
      platforms:
        - ventunoq:
            docker:
              image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/audio-analytics-models-runner:dev-next
              volumes:
                - ${download_location}:/models
              entrypoint: ["sh", "-c", "cd /models && qai_hub_models fetch ${model_name} -r ${model_type} -p ${quantization} -c ${chipset} -v ${version}"]