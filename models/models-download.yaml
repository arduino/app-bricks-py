runners:
  - ei-models-runner:
      platforms:
        - ventunoq:
            docker:
              image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/models-downloader:dev-next
              volumes:
                - ${download_location}:/models
              command: ["/app/ei_downloader/ei_model_downloader.sh"]
        - unoq:
            docker:
              image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/models-downloader:dev-next
              volumes:
                - ${download_location}:/models
              command: ["/app/ei_downloader/ei_model_downloader.sh"]
