runners:
  - ei-models-runner:
      platforms:
        - ventunoq:
            docker:
              image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/models-downloader:dev-next
              volumes:
                - ${download_location}:/models
              entrypoint: ["sh", "-c", "python /app/ei_downloader/download_ei_build.py --ei-project-id ${ei-project-id} --impulse-id ${ei-impulse-id} --output-name ${model_name} --output-dir /models --output-name ${model_name} --quantization ${quantization} --target ${target}"]
        - unoq:
            docker:
              image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/models-downloader:dev-next
              volumes:
                - ${download_location}:/models
              entrypoint: ["sh", "-c", "python /app/ei_downloader/download_ei_build.py --ei-project-id ${ei-project-id} --impulse-id ${ei-impulse-id} --output-name ${model_name} --output-dir /models --output-name ${model_name} --quantization ${quantization} --target ${target}"]
  - genie-models-runner:
      platforms:
        - ventunoq:
            docker:
              image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/models-downloader:dev-next
              volumes:
                - ${download_location}:/models
              entrypoint: ["sh", "-c", "cd /models && qai_hub_models fetch ${model_name} -r ${model_type} -p ${quantization} -c ${chipset} -v ${version}"]
  - audio-analytics-models-runner:
      platforms:
        - ventunoq:
            docker:
              image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/models-downloader:dev-next
              volumes:
                - ${download_location}:/models
              entrypoint: ["sh", "-c", "cd /models && qai_hub_models fetch ${model_name} -r ${model_type} -p ${quantization} -c ${chipset} -v ${version}"]