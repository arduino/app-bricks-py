id: arduino:decision_model
name: Decision Model
description: "Decision Model Brick answers typed questions (choice, score, yes/no) about a text or JSON state with calibrated probabilities, using a local llama.cpp decision model instead of a text-generating LLM."
category: ai
requires_services: ["arduino:llamacpp"]
model_by_boards:
  - platform: ventunoq
    model: llamacpp:Laya-Q8_0
  - platform: unoq
    model: llamacpp:Julia-1-Q8_0
supported_boards: ["unoq", "ventunoq"]
ai_frameworks_compatibility:
  - llamacpp
variables:
- name: LLAMA_ARG_CTX_SIZE
  description: Context size
  default_value: 8192