services:
  gesture_recognition:
    image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/gesture-recognition-runner:0.13.0rc1
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:5002:5002
      - ${BIND_ADDRESS_IPV6:-[::]}:5002:5002
    devices:
      - /dev/dma_heap/system
      - /dev/fastrpc-cdsp
    volumes:
      # Mount hexagon firmware
      - /sys/firmware/devicetree/base/model:/run/device-model
      # Read-only: /qairt-entrypoint.sh merges it into /usr/share/qcom in the container layer
      - ${HOST_DSP_INSTALLATION_PATH:-/usr/share/qcom}:/run/host-qcom:ro
    healthcheck:
      test: [ "CMD-SHELL", "nc -zv gesture_recognition 5002 || exit 1" ]
      interval: 1s
      timeout: 2s
      retries: 30