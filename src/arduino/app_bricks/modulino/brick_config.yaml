id: arduino:modulino
name: Modulino
description: "Modulino Brick enables seamless integration with various Modulino modules."
requires_sketch_library:
  - id: Arduino_ModulinoBridge
    version: 0.1.0
sketch:
  includes: |
    #include <Arduino_ModulinoBridge.h>
  globals: |
    ModulinoBridge modulinoBridge;
  setup: |
    modulinoBridge.begin();
