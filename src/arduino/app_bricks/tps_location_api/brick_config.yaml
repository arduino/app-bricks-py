id: arduino:tps_location_api
name: TPS Location API
description: Collects nearby Wi-Fi access points and determines device location using the Qualcomm TPS Location API cloud service
icon: 📍
category: location
version: 1.0.0
author: Qualcomm
variables:
  - name: AUTH_KEY
    description: TPS authentication key
    type: string
    secret: true
  - name: AUTH_USER
    description: TPS authentication user (e.g., "qualcomm-tester-1")
    type: string
  - name: TPS_LOC_API_URL
    description: TPS Location API endpoint URL, https only.
    type: string
    default_value: "https://global.skyhook.com/wps2/json/location"
    hidden: true
  - name: TPS_AUTH_VERSION
    description: TPS Location API authentication version header value.
    type: string
    default_value: "2.3"
    hidden: true
  - name: TPS_PROTO_VERSION
    description: TPS Location API protocol version header value.
    type: string
    default_value: "2.41"
    hidden: true
  - name: HTTP_REQ_TIMEOUT_SEC
    description: Timeout in seconds for requests to the scanner and to the location API.
    type: int
    default_value: 15
    hidden: true
  - name: SCAN_INTERFACE
    description: Wireless interface to scan on. Leave empty to use the first one found.
    type: string
    default_value: ""
    hidden: true
  - name: SCAN_CHANNEL_DWELL_TU
    description: Time the radio stays on each channel during a scan, in TUs (1 TU is 1024 microseconds). 0 leaves the driver default.
    type: int
    default_value: 60
    hidden: true
  - name: SCAN_TIMEOUT_SECONDS
    description: Timeout in seconds for each iw command.
    type: int
    default_value: 10
    hidden: true
  - name: SCAN_RETRIES
    description: Number of attempts when a scan fails because the radio is busy.
    type: int
    default_value: 3
    hidden: true
  - name: SCAN_CACHE_SECONDS
    description: Duration in seconds a scan result is reused before scanning again. Also the minimum interval between scans.
    type: int
    default_value: 10
    hidden: true
