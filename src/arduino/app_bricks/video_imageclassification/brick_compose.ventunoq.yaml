services:
  ei-video-classification-runner:
    image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/ei-qnn-models-runner:__BRICKS_RELEASE_VERSION__
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    devices:
      - /dev/dma_heap/system
      - /dev/fastrpc-cdsp         
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:4912:4912  # Embedded UI port
      - ${BIND_ADDRESS_IPV6:-[::]}:4912:4912  # Embedded UI port
    volumes:
      - "${CUSTOM_MODEL_PATH:-/home/arduino/.arduino-bricks}:${CUSTOM_MODEL_PATH:-/home/arduino/.arduino-bricks}"
      - /var/lib/arduino-app-cli/models/edge-impulse:/var/lib/arduino-app-cli/models/edge-impulse
      - ei-qnn-runner-cache:/home/arduino/.cache/node-compile-cache  # V8 compile cache, filled at the first start
      - /sys/firmware/devicetree/base/model:/run/device-model
      - ${HOST_DSP_INSTALLATION_PATH:-/usr/share/qcom}:/usr/share/qcom        
    command: ["--model-file", "${EI_V_CLASSIFICATION_MODEL:-/models/ootb/ei/mobilenet-v2-224px.eim}", "--gst-source", "tcpserversrc host=0.0.0.0 port=5050 ! jpegdec", "--dont-print-predictions", "--preview-original-resolution"]
    healthcheck:
      test: [ "CMD-SHELL", "grep -iE ':13BA [0-9A-F:]+ (0A|01) ' /proc/net/tcp || exit 1" ] # Port 5050 (hex 13BA) listening or serving a client: tcpserversrc stops listening once the app connects
      interval: 10s
      start_period: 30s
      start_interval: 1s
      timeout: 2s
      retries: 3

volumes:
  ei-qnn-runner-cache:
    name: arduino-ei-qnn-runner-cache
