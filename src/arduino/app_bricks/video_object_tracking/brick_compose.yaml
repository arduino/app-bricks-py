services:
  video-object-tracking-runner:
    image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/edge-impulse-npu-runner:__BRICKS_RELEASE_VERSION__
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    # The inference server of the brick, serving its one model on the NPU, see containers/ai/edge-impulse-server/README.md
    command: [--max-models=1, --max-clients=4, --memory-reserve-mb=512]
    cpuset: "0-3"                   # the big cores, scheduling on the small ones too costs about a quarter of the frame rate
    devices:
      - /dev/fastrpc-cdsp           # Hexagon NPU
      - /dev/dma_heap/system        # buffers shared with the DSP
    volumes:
      # The .eim models installed by the app CLI, next to the out-of-the-box ones of the image (/models/ootb/ei)
      - ${MODELS_PATH:-/var/lib/arduino-app-cli/models}/edge-impulse:/models/edge-impulse:ro
      - ${MODELS_PATH:-/var/lib/arduino-app-cli/models}/custom-ei:/models/custom-ei:ro
      # The socket the brick connects to, /app/.cache/video_object_tracking/ei.sock in the app container
      - "${APP_HOME:-.}/.cache/video_object_tracking:/ipc"
      # Mount hexagon firmware
      - /sys/firmware/devicetree/base/model:/run/device-model
      # Read-only: /qairt-entrypoint.sh merges it into /usr/share/qcom in the container
      - ${HOST_DSP_INSTALLATION_PATH:-/usr/share/qcom}:/run/host-qcom:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m               # the SDK creates its socket to the .eim process here
      - /usr/share/qcom:size=1m,mode=1777   # the merged DSP view written by /qairt-entrypoint.sh, writable by the arduino user
    shm_size: 64m                   # feature buffers shared with the .eim process
    stop_grace_period: 15s          # an inference in progress completes before the model is stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket as S;S.socket(S.AF_UNIX).connect('/ipc/ei.sock')"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      start_interval: 250ms
      retries: 3
