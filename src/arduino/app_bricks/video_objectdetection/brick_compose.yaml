services:
  video-object-detection-runner:
    image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/edge-impulse-runner:__BRICKS_RELEASE_VERSION__
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    # The inference server of the brick, serving its one model, see containers/ai/edge-impulse-runner/README.md
    # A saturated model gets a second instance: the .eim files are single-threaded, the container has three cores
    command: [--max-models=1, --max-clients=4, --memory-reserve-mb=256, --max-model-instances=2]
    cpus: "3"                       # leave one core to the app
    volumes:
      # The .eim models installed by the app CLI, next to the out-of-the-box ones of the image (/models/ootb/ei)
      - ${MODELS_PATH:-/var/lib/arduino-app-cli/models}/edge-impulse:/models/edge-impulse:ro
      - ${MODELS_PATH:-/var/lib/arduino-app-cli/models}/custom-ei:/models/custom-ei:ro
      # The socket the brick connects to, /app/.cache/video_object_detection/ei.sock in the app container
      - "${APP_HOME:-.}/.cache/video_object_detection:/ipc"
    read_only: true
    tmpfs:
      - /tmp:size=64m               # the SDK creates its socket to the .eim process here
    shm_size: 64m                   # feature buffers shared with the .eim process
    stop_grace_period: 15s          # an inference in progress completes before the model is stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket as S;S.socket(S.AF_UNIX).connect('/ipc/ei.sock')"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      start_interval: 250ms
      retries: 3
