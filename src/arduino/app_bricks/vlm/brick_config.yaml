id: arduino:vlm
name: Large Language Model - Vision
description: "Vision Language Model Brick enables seamless integration with locally hosted VLMs for advanced AI capabilities in your Arduino projects."
category: text
requires_services:
  - id: arduino:genie
    when:
      model: "genie:*"
  - id: arduino:llamacpp
    when:
      model: "llamacpp:*"
model_by_boards:
    - platform: ventunoq
      model: genie:qwen3_vl_4b_instruct
    - platform: unoq
      model: llamacpp:Qwen3.5-0.8B-Q4_0-multimodal
supported_boards: ["unoq", "ventunoq"]
ai_frameworks_compatibility:
  - genie
  - llamacpp
variables:
- name: LLAMA_ARG_CTX_SIZE
  description: Context size (LLama.cpp only)
  default_value: 16384
- name: LLAMA_ARG_THREADS
  description: CPU threads used by the model (LLama.cpp only)
  default_value: 4
