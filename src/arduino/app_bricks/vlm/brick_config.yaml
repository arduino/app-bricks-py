id: arduino:vlm
name: Vision Language Model (VLM)
description: "Vision Language Model (VLM) Brick enables seamless integration with locally hosted VLMs for advanced AI capabilities in your Arduino projects."
requires_services:
  - id: arduino:genie
    when:
      model: "genie:*"
  - id: arduino:llamacpp
    when:
      model: "llamacpp:*"
model: genie:qwen3_vl_4b_instruct
supported_boards: ["ventunoq"]
ai_frameworks_compatibility:
  - genie
  - llamacpp
variables:
- name: LLAMA_ARG_CTX_SIZE
  description: Context size (LLama.cpp only)
  default_value: 16384
