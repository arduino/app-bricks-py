services:
  edge-impulse-runner:
    image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/edge-impulse-runner:__BRICKS_RELEASE_VERSION__
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    # Starting values, see containers/ai/edge-impulse-runner/README.md
    command: [--max-models=1, --max-clients=4, --memory-reserve-mb=256]
    cpus: "3"                       # leave one core to the app
    volumes:
      # The .eim models installed by the app CLI, next to the out-of-the-box ones of the image (/models/ootb/ei)
      - ${MODELS_PATH:-/var/lib/arduino-app-cli/models}/edge-impulse:/models/edge-impulse:ro
      - ${MODELS_PATH:-/var/lib/arduino-app-cli/models}/custom-ei:/models/custom-ei:ro
      # The socket the bricks connect to, /app/.cache/edge_impulse/ei.sock in the app container
      - "${APP_HOME:-.}/.cache/edge_impulse:/ipc"
    read_only: true
    tmpfs:
      - /tmp:size=64m               # the SDK creates its socket to each .eim process here
    shm_size: 64m                   # feature buffers shared with the .eim processes
    stop_grace_period: 15s          # an inference in progress completes before the models are stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket as S;S.socket(S.AF_UNIX).connect('/ipc/ei.sock')"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
