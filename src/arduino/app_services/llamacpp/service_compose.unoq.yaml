services:
  llamacpp-models-runner:
    image: ${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/}app-bricks/llamacpp-runner:__BRICKS_RELEASE_VERSION__
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      - LLAMA_LOG_LEVEL=error
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=9999
      - LLAMA_ARG_POLL=0
      - LLAMA_ARG_BATCH=512
      - LLAMA_ARG_UBATCH=128
      - LLAMA_ARG_MODELS_DIR=/models
      - LLAMA_ARG_FLASH_ATTN=${LLAMA_ARG_FLASH_ATTN:-on}
      - LLAMA_ARG_MODELS_MAX=${LLAMA_ARG_MODELS_MAX:-1}
      - LLAMA_ARG_CTX_SIZE=${LLAMA_ARG_CTX_SIZE:-16384}
      - LLAMA_ARG_REASONING=${LLAMA_ARG_REASONING:-off}
      - LLAMA_ARG_THINK_BUDGET=${LLAMA_ARG_THINK_BUDGET:-0}
      - LLAMA_ARG_IMAGE_MAX_TOKENS=${LLAMA_ARG_IMAGE_MAX_TOKENS:-128}
      # One thread per core is the fastest setting while the cores are free. A thread that shares its core with
      # another busy process holds the others back: LLAMA_ARG_THREADS=3 leaves one core to a second CPU-heavy task.
      - LLAMA_ARG_THREADS=${LLAMA_ARG_THREADS:-4}
      - OMP_NUM_THREADS=${LLAMA_ARG_THREADS:-4}
      - GOMP_SPINCOUNT=${GOMP_SPINCOUNT:-300000}
      - XDG_CACHE_HOME=/models
    working_dir: /models
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:9999:9999
      - ${BIND_ADDRESS_IPV6:-[::1]}:9999:9999
    # A crash dumps no core: it would be GBs written into the models directory.
    ulimits:
      core: 0
    mem_limit: 2500m
    memswap_limit: 2500m
    volumes:
      - /var/lib/arduino-app-cli/models/llamacpp/:/models/